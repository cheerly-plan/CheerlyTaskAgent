name: verify

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - run: uv sync

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: pnpm --dir web install --frozen-lockfile

      - name: Python tests
        run: uv run pytest -q

      - name: Lint
        run: uv run ruff check src tests

      - name: Typecheck
        run: pnpm --dir web typecheck

      - name: Frontend build
        run: pnpm --dir web build

      - name: Real-repo gate smoke
        run: uv run python scripts/gate_smoke.py
