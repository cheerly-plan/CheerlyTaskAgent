<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CheerlyTaskAgent · 需求调度台</title>

<!-- React 运行时 + antd 通过 CDN 引入；组件在脚本中从 antd 全局对象按需解构 -->
<link rel="stylesheet" href="https://unpkg.com/antd@4.24.16/dist/antd.min.css">
<script src="https://unpkg.com/react@17.0.2/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@17.0.2/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/antd@4.24.16/dist/antd.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.23.10/babel.min.js" crossorigin></script>

<style>
  :root{
    --brand:#5B54C4; --brand-600:#4841AE; --brand-050:#F0EFFB; --brand-100:#E5E3F7;
    --ink:#24263A; --ink-2:#5A5D70; --muted:#9698A9;
    --line:#E9E9F0; --line-2:#F2F2F7;
    --surface:#FFFFFF; --canvas:#F6F6F9;
    --ok:#2E9E6B; --danger:#D64550; --warn:#D98A0B;
    --radius:10px;
    --sh1:0 1px 2px rgba(28,30,54,.04), 0 2px 10px rgba(28,30,54,.03);
    --sh2:0 10px 30px rgba(28,30,54,.10);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--canvas);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  #root{min-height:100vh}

  /* ── 顶栏 ───────────────────────────────────────────── */
  .app-header{
    position:sticky;top:0;z-index:20;
    display:flex;align-items:center;justify-content:space-between;
    height:64px;padding:0 32px;
    background:rgba(255,255,255,.92);backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
  }
  .app-title{
    font-size:18px;font-weight:700;letter-spacing:-.3px;color:var(--ink);
    display:inline-flex;align-items:center;gap:10px;
  }
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;
    background:linear-gradient(135deg,var(--brand),#8B7FE8);
    box-shadow:0 0 0 4px var(--brand-050);margin-right:0}
  .app-header .ant-tag{
    border-radius:999px;border:1px solid var(--line);background:var(--canvas);
    padding:4px 12px;font-size:12px;color:var(--ink-2);
    display:inline-flex;align-items:center;gap:7px;margin:0;
  }
  .app-header .ant-tag .dot{width:7px;height:7px;box-shadow:none}

  .main{padding:28px 32px 48px;max-width:1520px;margin:0 auto}

  /* ── 全局 antd 观感统一 ─────────────────────────────── */
  .ant-typography-secondary{color:var(--muted) !important}
  .main h4.ant-typography{font-size:19px;font-weight:700;letter-spacing:-.2px;color:var(--ink)}
  .main h5.ant-typography{font-size:13px;font-weight:700;letter-spacing:.4px}

  /* Tabs：大号下划线，激活品牌色 */
  .main > .ant-tabs > .ant-tabs-nav{margin-bottom:22px}
  .main > .ant-tabs > .ant-tabs-nav::before{border-bottom:1px solid var(--line)}
  .main .ant-tabs-tab{padding:12px 2px 14px;font-size:14px;font-weight:500;color:var(--ink-2)}
  .main .ant-tabs-tab + .ant-tabs-tab{margin-left:28px}
  .main .ant-tabs-tab .ant-tabs-tab-btn{transition:color .15s}
  .main .ant-tabs-tab:hover .ant-tabs-tab-btn{color:var(--brand)}
  .main .ant-tabs-tab.ant-tabs-tab-active .ant-tabs-tab-btn{color:var(--brand);font-weight:600}
  .main .ant-tabs-ink-bar{background:var(--brand);height:3px;border-radius:3px 3px 0 0}

  /* Card：细边框 + 柔和阴影 */
  .ant-card{border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--sh1)}
  .ant-card-body{padding:22px 24px}
  .ant-card-hoverable{transition:transform .18s,box-shadow .18s,border-color .18s}
  .ant-card-hoverable:hover{border-color:var(--brand-100);box-shadow:0 8px 28px rgba(91,84,196,.10);transform:translateY(-1px)}

  /* 表格：去线化、圆角容器、悬浮高亮 */
  .ant-table-wrapper .ant-table{border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--sh1);overflow:hidden}
  .ant-table-thead > tr > th{
    background:#FAFAFC !important;color:var(--muted) !important;
    font-size:12px;font-weight:600;letter-spacing:.3px;
    padding:13px 16px !important;border-bottom:1px solid var(--line) !important;
  }
  .ant-table-thead > tr > th::before{display:none !important}
  .ant-table-tbody > tr > td{padding:12px 16px !important;border-bottom:1px solid var(--line-2) !important;font-size:13px}
  .ant-table-tbody > tr:last-child > td{border-bottom:none !important}
  .ant-table-tbody > tr:hover > td,
  .ant-table-tbody > tr.ant-table-row:hover > td,
  .ant-table-cell-row-hover{background:var(--brand-050) !important}
  .ant-table-placeholder:hover > td{background:#fff !important}

  /* 按钮 */
  .ant-btn{border-radius:8px;font-weight:500;box-shadow:none;transition:all .15s}
  .ant-btn-primary{background:var(--brand);border-color:var(--brand);box-shadow:0 2px 6px rgba(91,84,196,.22)}
  .ant-btn-primary:hover,.ant-btn-primary:focus{background:var(--brand-600) !important;border-color:var(--brand-600) !important}
  .ant-btn-sm{border-radius:7px;font-size:12px}
  .ant-btn-dangerous:not(.ant-btn-primary){color:var(--danger)}
  .ant-btn-dangerous.ant-btn-primary{background:var(--danger);border-color:var(--danger);box-shadow:0 2px 6px rgba(214,69,80,.2)}
  .ant-btn-dangerous.ant-btn-primary:hover{background:#C13A44 !important;border-color:#C13A44 !important}

  /* 标签 */
  .ant-tag{border-radius:6px;font-size:11.5px;font-weight:500;padding:2px 9px;line-height:20px;margin-inline-end:6px}

  /* 表单控件 */
  .ant-input,.ant-input-number,.ant-select-selector{
    border-radius:8px !important;border-color:var(--line) !important;background:#fff !important;
    transition:border-color .15s,box-shadow .15s;
  }
  .ant-input:hover,.ant-select:hover .ant-select-selector{border-color:#C7C4E8 !important}
  .ant-input:focus,.ant-select-focused .ant-select-selector{
    border-color:var(--brand) !important;box-shadow:0 0 0 3px var(--brand-050) !important;
  }
  .ant-select-dropdown{border-radius:10px;box-shadow:var(--sh2)}
  .ant-select-item-option-selected:not(.ant-select-item-option-disabled){background:var(--brand-050) !important;color:var(--brand-600) !important;font-weight:500}
  .ant-radio-button-wrapper{border-color:var(--line);color:var(--ink-2);font-size:12px;background:#fff}
  .ant-radio-button-wrapper-checked:not(.ant-radio-button-wrapper-disabled){color:var(--brand);border-color:var(--brand);box-shadow:-1px 0 0 0 var(--brand)}
  /* solid 风格的 Radio.Group（表格/卡片切换）：选中态用品牌色，去掉默认蓝 */
  .ant-radio-group-solid .ant-radio-button-wrapper-checked:not(.ant-radio-button-wrapper-disabled),
  .ant-radio-group-solid .ant-radio-button-wrapper-checked:not(.ant-radio-button-wrapper-disabled):hover,
  .ant-radio-group-solid .ant-radio-button-wrapper-checked:not(.ant-radio-button-wrapper-disabled):focus{
    background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:-1px 0 0 0 var(--brand);
  }
  .ant-switch{background:#C9CAD6}
  .ant-switch-checked{background:var(--brand)}
  .ant-empty-description{color:var(--muted)}

  /* 弹窗 */
  .ant-modal-content{border-radius:14px;box-shadow:var(--sh2);overflow:hidden}
  .ant-modal-header{padding:18px 24px;border-bottom:1px solid var(--line)}
  .ant-modal-title{font-size:16px;font-weight:700;color:var(--ink)}
  .ant-modal-body{padding:22px 24px}
  .ant-modal-footer{padding:14px 24px;border-top:1px solid var(--line)}

  .field{margin-bottom:14px}
  .field-label{font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:6px;letter-spacing:.2px}

  /* 目录浏览行 */
  .dir-row{display:flex;align-items:center;gap:8px;padding:9px 11px;border-bottom:1px solid var(--line-2);cursor:pointer;font-size:13px}
  .dir-row:last-child{border-bottom:none}
  .dir-row:hover{background:var(--brand-050)}

  /* 报告预览（渲染后的 markdown） */
  .report-body{font-size:13px;line-height:1.7;color:var(--ink-2)}
  .report-body h2{font-size:17px;font-weight:700;margin:0 0 12px;color:var(--ink)}
  .report-body h3{font-size:14px;font-weight:700;margin:20px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line);color:var(--ink)}
  .report-body h4{font-size:13px;font-weight:700;margin:14px 0 6px;color:var(--ink)}
  .report-body p{margin:6px 0}
  .report-body .md-table{width:100%;border-collapse:collapse;font-size:12px;margin:8px 0 12px}
  .report-body .md-table th,.report-body .md-table td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
  .report-body .md-table th{background:#FAFAFC;color:var(--muted);font-weight:600;white-space:nowrap}
  .report-body .md-table td{word-break:break-word}
  .report-body .md-code{margin:6px 0;background:#F6F6FA;border-radius:8px;padding:11px 12px;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;line-height:1.6;white-space:pre-wrap;word-break:break-word;overflow:auto}
  .report-body blockquote{margin:8px 0;padding:8px 12px;background:#FDF6E9;color:#96610C;
    border-left:3px solid var(--warn);border-radius:0 6px 6px 0;font-size:12px}
  .report-body ul{margin:6px 0;padding-left:20px}
  .report-body li{margin:2px 0}
  .report-body code{background:#F0EFF8;color:var(--brand-600);padding:1px 5px;border-radius:4px;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
  .report-body details{border:1px solid var(--line);border-radius:8px;margin:10px 0;padding:0 12px}
  .report-body details>summary{cursor:pointer;padding:10px 0;font-size:12px;font-weight:600;color:var(--brand);list-style:none}
  .report-body details>summary::-webkit-details-marker{display:none}
  .report-body details>summary::before{content:'▸ ';display:inline-block;transition:transform .15s}
  .report-body details[open]>summary::before{transform:rotate(90deg)}
  .report-body details[open]{padding-bottom:12px}

  @media(max-width:900px){.main{padding:20px 16px}.app-header{padding:0 16px}}
</style>

<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
// ── CDN 按需引入：从 antd 全局对象里只取本页面用到的组件 ───────────────────
const {useState, useEffect, useRef} = React;
const {
  Button, Table, Modal, Select, Input, InputNumber, Tabs, Tag, Switch, Checkbox, Radio,
  message, Spin, Empty, Alert, Card, Row, Col, Space, Typography,
} = antd;
const {Option} = Select;
const {TextArea, Password} = Input;
const {Text, Title} = Typography;

const kindLabel={bug:'缺陷',feature:'需求',task:'任务'};
const statusLabel={discovered:'待映射',ready:'就绪',queued:'排队',running:'执行中',succeeded:'成功',failed:'失败',skipped:'跳过',cancelled:'已取消'};
const kindColor={bug:'red',feature:'purple',task:'blue'};
const statusColor={discovered:'default',ready:'gold',queued:'gold',running:'processing',succeeded:'success',failed:'error',skipped:'default',cancelled:'default'};
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// Lightweight Markdown renderer tailored to the generated reports (kept verbatim).
function renderMarkdown(md){
  const lines=String(md||'').split('\n');
  const out=[];
  let i=0;
  const inline=t=>esc(t)
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  const fenced=(code, lang)=>{
    const full=code.join('\n');
    const body=esc(full);
    if(full.length>2000){
      const shown=full.slice(0,6000);
      const tail=full.length>6000?`\n\n…（已截断，完整内容请下载 .md）`:'';
      return `<details><summary>原始输出（${full.length} 字符，点击展开）</summary><pre class="md-code">${esc(shown)}${tail}</pre></details>`;
    }
    return `<pre class="md-code">${body}</pre>`;
  };
  while(i<lines.length){
    const line=lines[i];
    if(/^\s*<details\b/i.test(line)){
      const block=[];
      while(i<lines.length){
        block.push(lines[i]);
        if(/^\s*<\/details>/i.test(lines[i])){i++;break;}
        i++;
      }
      // summary 可能与 <details> 同行，也可能独占一行：从整块里取一次标题
      let summaryText='详情';
      for(const bl of block){
        const sm=bl.match(/<summary[^>]*>([\s\S]*?)<\/summary>/i);
        if(sm){summaryText=sm[1];break;}
      }
      // 正文只处理中间内容，跳过首行(<details>)与闭合行(</details>)，避免标签被 inline() 二次转义成文本
      let inner=''; let k=1;
      while(k<block.length){
        const l=block[k];
        if(/^\s*<\/details>/i.test(l) || /<summary[^>]*>/i.test(l)){k++;continue;}
        if(/^\s*```/.test(l)){
          k++; const code=[];
          while(k<block.length && !/^\s*```/.test(block[k])){code.push(block[k]);k++;}
          k++; inner+=`<pre class="md-code">${esc(code.join('\n'))}</pre>`;
        }else if(l.trim()){
          inner+=`<p>${inline(l)}</p>`;k++;
        }else{k++;}
      }
      out.push(`<details><summary>${inline(summaryText)}</summary>${inner}</details>`);
      continue;
    }
    if(/^\s*```/.test(line)){
      i++; const code=[];
      while(i<lines.length && !/^\s*```/.test(lines[i])){code.push(lines[i]);i++;}
      i++; out.push(fenced(code)); continue;
    }
    const h=line.match(/^(#{1,6})\s+(.*)$/);
    if(h){const lv=Math.min(h[1].length+1,5);out.push(`<h${lv}>${inline(h[2])}</h${lv}>`);i++;continue;}
    if(/^\s*\|/.test(line) && i+1<lines.length && /^\s*\|[\s:|\-]+\|\s*$/.test(lines[i+1])){
      const cells=r=>r.split('|').slice(1,-1).map(s=>s.trim());
      const head=cells(line); i+=2;
      const rows=[];
      while(i<lines.length && /^\s*\|/.test(lines[i])){rows.push(cells(lines[i]));i++;}
      out.push('<table class="md-table"><thead><tr>'+head.map(c=>`<th>${inline(c)}</th>`).join('')+'</tr></thead><tbody>'+
        rows.map(r=>'<tr>'+r.map(c=>`<td>${inline(c)}</td>`).join('')+'</tr>').join('')+'</tbody></table>');
      continue;
    }
    if(/^\s*>\s?/.test(line)){out.push(`<blockquote>${inline(line.replace(/^\s*>\s?/,''))}</blockquote>`);i++;continue;}
    if(/^\s*[-*]\s+/.test(line)){
      const li=[];
      while(i<lines.length && /^\s*[-*]\s+/.test(lines[i])){li.push(inline(lines[i].replace(/^\s*[-*]\s+/,'')));i++;}
      out.push('<ul>'+li.map(t=>`<li>${t}</li>`).join('')+'</ul>');continue;
    }
    if(!line.trim()){i++;continue;}
    out.push(`<p>${inline(line)}</p>`);i++;
  }
  return out.join('\n');
}

async function api(path, opts){
  const res=await fetch(path,opts);
  if(!res.ok){let msg=res.statusText;try{msg=(await res.json()).detail||msg}catch(e){}throw new Error(msg)}
  return res.status===204?null:res.json();
}

function Field({label, children}){
  return <div className="field"><div className="field-label">{label}</div>{children}</div>;
}

function App(){
  // ── 数据状态 ────────────────────────────────────────────────────────────
  const [items,setItems]=useState([]);
  const [mappings,setMappings]=useState([]);
  const [modelChoices,setModelChoices]=useState([]);
  const [defaultModel,setDefaultModel]=useState('');
  const [settings,setSettings]=useState(null);
  const [conn,setConn]=useState('连接中…');
  const [page,setPage]=useState('tasks');
  const [viewMode,setViewMode]=useState('table');
  const [filters,setFilters]=useState({source:'',status:'',project:'',sort:'created:desc'});
  const [actionSels,setActionSels]=useState({});

  // ── 弹窗状态 ────────────────────────────────────────────────────────────
  const [newTaskOpen,setNewTaskOpen]=useState(false);
  const [newSub,setNewSub]=useState('manual');
  const [form,setForm]=useState({title:'',body:'',kind:'task',repo:'',model:''});
  const [emailForm,setEmailForm]=useState({title:'',body:'',mode:'dry-run'});
  const [fsOpen,setFsOpen]=useState(false);
  const [fsLoading,setFsLoading]=useState(false);
  const [fs,setFs]=useState({current:'',parent:null,at_root:true,dirs:[]});
  const fsPickCb=useRef(null);
  const [scanOpen,setScanOpen]=useState(false);
  const [scanLoading,setScanLoading]=useState(false);
  const [scanRoot,setScanRoot]=useState('');
  const [scanItems,setScanItems]=useState([]);
  const [mapOpen,setMapOpen]=useState(false);
  const [editingMapId,setEditingMapId]=useState(null);
  const [mapForm,setMapForm]=useState({name:'',aliases:'',path:'',note:''});
  const [reportOpen,setReportOpen]=useState(false);
  const [report,setReport]=useState({title:'',html:'',url:null,download:''});
  const [confirm,setConfirm]=useState({open:false,message:'',resolve:null});
  const esRef=useRef(null);

  // ── 数据加载 ────────────────────────────────────────────────────────────
  async function loadConfig(){
    const cfg=await api('/api/config');
    setModelChoices(cfg.models||[]);
    setDefaultModel(cfg.default_model||'');
    setConn('已连接 · 执行端 '+cfg.executor);
  }
  async function loadSettings(){
    const s=await api('/api/settings');
    setSettings({...s, imap:{...(s.imap||{}), password:''}}); // 不回显已保存的密码
  }
  async function loadMappings(){
    const d=await api('/api/mappings');
    setMappings(d.mappings||[]);
  }
  async function loadItems(){
    try{ const d=await api('/api/items'); setItems(d.items||[]); }
    catch(e){ message.error('加载任务失败：'+e.message); }
  }
  async function loadAll(){
    try{
      await loadConfig();
      await Promise.all([loadMappings(),loadItems(),loadSettings()]);
    }catch(e){ message.error('加载失败：'+e.message); }
  }
  function connectSSE(){
    if(esRef.current) esRef.current.close();
    const es=new EventSource('/api/events');
    es.onmessage=e=>{ if(e.data!=='[DONE]') loadItems(); };
    es.onerror=()=>setConn('重连中…');
    es.onopen=()=>setConn('实时连接已就绪');
    esRef.current=es;
  }
  useEffect(()=>{ loadAll(); connectSSE(); return ()=>{ if(esRef.current) esRef.current.close(); }; },[]);

  const setFilter=(k,v)=>setFilters(prev=>({...prev,[k]:v}));
  const setActionSel=(id,k,v)=>setActionSels(prev=>({...prev,[id]:{...(prev[id]||{}),[k]:v}}));

  // ── 确认弹窗（保留异步 Promise 语义） ───────────────────────────────────
  function askConfirm(text){
    setConfirm({open:true,message:text,resolve:null});
    return new Promise(resolve=>setConfirm(prev=>({...prev,resolve})));
  }
  function closeConfirm(result){
    const r=confirm.resolve;
    setConfirm({open:false,message:'',resolve:null});
    if(r) r(result);
  }

  // ── 系统设置 ────────────────────────────────────────────────────────────
  const setSetting=(k,v)=>setSettings(s=>({...s,[k]:v}));
  const setImap=(k,v)=>setSettings(s=>({...s,imap:{...(s.imap||{}),[k]:v}}));
  async function saveSettings(){
    const s=settings||{}, imap=s.imap||{};
    const payload={
      executor:s.executor||'codebuddy',
      codebuddy_command:(s.codebuddy_command||'').trim(),
      workbuddy_cli_path:(s.workbuddy_cli_path||'').trim(),
      dsh_path:(s.dsh_path||'').trim(),
      default_model:s.default_model||'',
      max_concurrent:Math.max(1,Number(s.max_concurrent)||1),
      auto_sync:s.auto_sync!==false,
      imap:{host:(imap.host||'').trim(),port:Number(imap.port)||993,user:(imap.user||'').trim(),password:imap.password||'',use_ssl:imap.use_ssl!==false},
    };
    try{
      await api('/api/settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
      await loadSettings();
      message.success('设置已保存（部分参数需重启服务后生效）');
    }catch(e){ message.error('保存失败：'+e.message); }
  }

  // ── 项目映射 ────────────────────────────────────────────────────────────
  function openMapModal(m){
    setEditingMapId(m&&m.id?m.id:null);
    setMapForm({name:(m&&m.name)||'',aliases:((m&&m.aliases)||[]).join(', '),path:(m&&m.path)||'',note:(m&&m.note)||''});
    setMapOpen(true);
  }
  async function saveMapFromModal(){
    const payload={
      name:(mapForm.name||'').trim(),
      aliases:(mapForm.aliases||'').split(',').map(s=>s.trim()).filter(Boolean),
      path:(mapForm.path||'').trim(),
      note:(mapForm.note||'').trim(),
    };
    if(!payload.name){ message.warning('请输入项目名'); return; }
    try{
      await api(editingMapId?`/api/mappings/${editingMapId}`:'/api/mappings',{
        method:editingMapId?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)
      });
      setMapOpen(false);
      await loadMappings();

  async function onMapAction(act,id){
    if(act==='add'){ openMapModal(null); return; }
    if(act==='edit'){ openMapModal(mappings.find(x=>x.id===id)); return; }
    if(act==='toggle'){
      const m=mappings.find(x=>x.id===id); if(!m)return;
      try{
        await api(`/api/mappings/${id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled:!m.enabled})});
        await loadMappings();
      }catch(e){ message.error('操作失败：'+e.message); }
      return;
    }
    if(act==='del'){
      if(!await askConfirm('删除这条项目映射？'))return;
      try{ await api(`/api/mappings/${id}`,{method:'DELETE'}); await loadMappings(); message.success('映射已删除'); }
      catch(e){ message.error('删除失败：'+e.message); }
    }
  }

  async function browseTo(path){

      setFs({current:d.current,parent:d.parent,at_root:d.at_root,dirs:d.dirs});

  async function scanFolder(path){
    setScanOpen(true); setScanLoading(true); setScanRoot(path); setScanItems([]);
    try{
      const d=await api('/api/fs/scan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path,depth:2})});
      setScanRoot(d.root);
      setScanItems((d.candidates||[]).map(c=>({...c,checked:false})));
    }catch(e){ setScanOpen(false); message.error('扫描失败：'+e.message); }
    finally{ setScanLoading(false); }

  function toggleAllScan(){
    const all=scanItems.length>0 && scanItems.every(c=>c.checked);
    setScanItems(scanItems.map(c=>({...c,checked:!all})));

  async function addScanned(){
    const chosen=scanItems.filter(c=>c.checked);
    if(!chosen.length){ message.warning('请先勾选要加入的文件夹'); return; }
    const payload=chosen.map(c=>({
      name:c.candidate_name||c.name,aliases:[c.name],path:c.path,enabled:true,
      note:c.is_git?('git: '+c.origin):'手动扫描添加',
    }));
    try{
      const r=await api('/api/mappings/bulk',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({items:payload})});
      setScanOpen(false);
      await loadMappings();
      let msg='已加入 '+r.added.length+' 条映射';
      if(r.failed.length) msg+='；跳过 '+r.failed.length+' 条：'+r.failed.map(f=>f.item.name+'（'+f.error+'）').join('、');
      message.success(msg);
    }catch(e){ message.error('加入失败：'+e.message); }
  }

  // ── 任务列表 ────────────────────────────────────────────────────────────
  function filteredItems(){
    let list=items.slice();
    if(filters.source) list=list.filter(i=>i.source===filters.source);
    if(filters.status) list=list.filter(i=>i.status===filters.status);
    if(filters.project) list=list.filter(i=>filters.project==='__none__'? !i.repo : i.repo===filters.project);
    const [field,dir]=filters.sort.split(':');
    const value=it=>{
      if(field==='created') return it.created_at||'';
      if(field==='status')  return statusLabel[it.status]||it.status||'';
      if(field==='source')  return it.source||'';
      if(field==='repo')    return it.repo||'';
      if(field==='kind')    return kindLabel[it.kind]||it.kind||'';
      return it.title||'';
    };
    list.sort((a,b)=>{
      const cmp=String(value(a)).localeCompare(String(value(b)),'zh-CN');
      return dir==='asc'?cmp:-cmp;
    });
    return list;
  }

  async function openReport(id){
    const it=items.find(x=>x.id===id);
    const title='工单详情 / 报告 · '+String(id).slice(-8);
    if(it && it.report_path){
      const url=`/api/items/${encodeURIComponent(id)}/report`;
      try{
        const res=await fetch(url);
        if(!res.ok) throw new Error((await res.text())||res.statusText);
        setReport({title,html:renderMarkdown(await res.text()),url,download:`${id}.md`});
      }catch(e){ message.error('打开报告失败：'+e.message); return; }
    }else{
      const summary=it?[
        '标题：'+it.title,
        '状态：'+(statusLabel[it.status]||it.status),
        '类型：'+(kindLabel[it.kind]||it.kind)+'　来源：'+it.source,
        '项目：'+(it.repo||'未映射')+'　模式：'+it.exec_mode,
        it.model?'模型：'+it.model:'模型：跟随全局',
        it.stage?'阶段：'+it.stage:'',
        it.error?'错误：'+it.error:'',
        '',
        '该工单还没有生成报告。执行 dry-run 或 apply 后即可查看完整报告。',
      ].filter(Boolean).join('\n'):'工单不存在或已被删除。';
      setReport({title,html:`<pre class="md-code">${esc(summary)}</pre>`,url:null,download:''});
    }
    setReportOpen(true);
  }

  async function onAction(act,id){
    const it=items.find(x=>x.id===id); const s=actionSels[id]||{};
    try{
      if(act==='report'){ await openReport(id); return; }
      if(act==='map'){
        const repo=s.map||(it&&it.repo);
        if(!repo){ message.warning('请先选择仓库'); return; }
        await api(`/api/items/${id}/map`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({repo_name:repo})});
      }else if(act==='dry'){
        const model=s.model||(it&&it.model)||null;
        await api(`/api/items/${id}/run`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({exec_mode:'dry-run',model})});
      }else if(act==='apply'){
        const model=s.model||(it&&it.model)||null;
        if(!await askConfirm('apply 会在隔离 worktree 中真实执行 codebuddy 改代码（不会提交/推送）。确认继续？'))return;
        await api(`/api/items/${id}/run`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({exec_mode:'apply',approved:true,model})});
      }else if(act==='cancel'){
        await api(`/api/items/${id}/cancel`,{method:'POST'});
      }else if(act==='delete'){
        if(!await askConfirm('删除这条工单及其本地记录？此操作不可撤销。'))return;
        await api(`/api/items/${id}`,{method:'DELETE'});
      }
    }catch(e){ message.error('操作失败：'+e.message); return; }
    await loadItems();
  }

  function actionButtons(it){
    const s=actionSels[it.id]||{};
    const dryDone=it.status==='succeeded' && it.exec_mode==='dry-run';
    const retryable=['failed','cancelled'].includes(it.status);
    const terminal=['succeeded','failed','skipped','cancelled'].includes(it.status)&&!dryDone&&!retryable;
    const running=['running','queued'].includes(it.status);
    const out=[];
    if(!it.repo){
      out.push(<Select key="repo" size="small" style={{width:130}} value={s.map||undefined} placeholder="选仓库…" onChange={v=>setActionSel(it.id,'map',v)}>
        {mappings.filter(m=>m.enabled).map(m=><Option key={m.id} value={m.name}>{m.name}</Option>)}
      </Select>);
      out.push(<Button key="map" size="small" onClick={()=>onAction('map',it.id)}>映射</Button>);
    }
    if(retryable) out.push(<Button key="dry" size="small" onClick={()=>onAction('dry',it.id)}>重试</Button>);
    else if(!dryDone&&!terminal&&!running) out.push(<Button key="dry" size="small" onClick={()=>onAction('dry',it.id)}>dry-run</Button>);
    if(!terminal&&!running) out.push(<Button key="apply" size="small" type="primary" danger onClick={()=>onAction('apply',it.id)}>apply</Button>);
    if(running) out.push(<Button key="cancel" size="small" onClick={()=>onAction('cancel',it.id)}>取消</Button>);
    if(!terminal&&!running){
      out.push(<Select key="model" size="small" style={{width:150}} value={s.model!==undefined?s.model:''} onChange={v=>setActionSel(it.id,'model',v)}>
        <Option value="">默认（跟随全局）</Option>
        {modelChoices.map(m=><Option key={m.id} value={m.id}>{m.label}</Option>)}
      </Select>);
    }
    if(it.report_path) out.push(<Button key="report" size="small" onClick={()=>onAction('report',it.id)}>报告</Button>);
    out.push(<Button key="delete" size="small" danger onClick={()=>onAction('delete',it.id)}>删除</Button>);
    return <Space size={4} wrap onClick={e=>e.stopPropagation()}>{out}</Space>;
  }

    const run_now=mode!=='draft';
    const exec_mode=mode==='apply'?'apply':'dry-run';
    if(mode==='apply'){
      const ok=await askConfirm('apply 会在 '+form.repo+' 的隔离 worktree 中真实执行 codebuddy 改代码（不提交/推送）。确认继续？');
      if(!ok)return;

    try{
      await api('/api/tasks/manual',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
        title,description:form.body,kind:form.kind,repo_name:form.repo,exec_mode,
        model:form.model||null,run_now,approved:mode==='apply',
      })});
      setForm(f=>({...f,title:'',body:''}));
      setNewTaskOpen(false);
      await loadItems();
      message.success(mode==='draft'?'草稿已创建':'工单已创建并提交执行');

            <Input value={(settings.imap||{}).user||''} placeholder="you@example.com" onChange={e=>setImap('user',e.target.value)} />
          </Field>
          <Field label="密码 / 授权码">
            <Password value={(settings.imap||{}).password||''} placeholder="留空表示保持已保存值不变" onChange={e=>setImap('password',e.target.value)} />
          </Field>
          <Alert type="warning" showIcon message="凭证以明文保存在本机 data/settings.json，请注意文件权限；密码留空即可保留原值。" />
          <Title level={5} style={{color:'#534AB7',marginTop:18}}>扩展能力</Title>
          <Text type="secondary">当前支持邮件、手动录入两类工单，调度本地 CLI 自动处理 Bug 与需求；TAPD 连接器为预留扩展点，暂未启用。</Text>
        </Col>
      </Row>
      <Space style={{marginTop:18}}>
        <Button type="primary" onClick={saveSettings}>保存设置</Button>
        <Button onClick={()=>loadSettings().then(()=>message.success('设置已重新载入'))}>重新载入</Button>
      </Space>
      <div style={{marginTop:12}}><Text type="secondary">说明：CLI 路径、默认模型等运行时参数在保存后需重启服务才会对新任务生效。</Text></div>
    </Card>
  ) : <Spin />;

  return (
    <div>
      <header className="app-header">
        <div><span className="app-title">CheerlyTaskAgent</span><Text type="secondary" style={{marginLeft:12,fontSize:13}}>需求调度台 · 手动 / 邮箱 → 本地 CLI（TAPD 预留）</Text></div>
        <Tag color="processing"><span className="dot" />{conn}</Tag>
      </header>
      <main className="main">
        <Tabs activeKey={page} onChange={setPage} items={[
          {key:'tasks',label:'任务列表',children:tasksPage},
          {key:'mapping',label:'项目映射',children:mappingPage},
          {key:'settings',label:'系统设置',children:settingsPage},
        ]} />
      </main>

      {/* 新建任务弹窗 */}
      <Modal title="新建任务" visible={newTaskOpen} width={640} destroyOnClose
        onCancel={()=>setNewTaskOpen(false)}
        footer={newSub==='email'?[
          <Button key="cancel" onClick={()=>setNewTaskOpen(false)}>取消</Button>,
          <Button key="import" type="primary" onClick={importEmail}>导入邮件</Button>,
        ]:[
          <Button key="cancel" onClick={()=>setNewTaskOpen(false)}>取消</Button>,
          <Button key="draft" onClick={()=>createManual('draft')}>创建草稿</Button>,
          <Button key="dry" onClick={()=>createManual('dry')}>创建并 dry-run</Button>,
          <Button key="apply" type="primary" danger onClick={()=>createManual('apply')}>创建并 apply</Button>,
        ]}>
        <Tabs activeKey={newSub} onChange={setNewSub} items={[
          {key:'manual',label:'手动新建',children:(
            <div>
              <Text type="secondary">不依赖邮件/TAPD。选好项目，直接写需求或 bug，创建后即可执行。</Text>
              <Row gutter={18} style={{marginTop:12}}>
                <Col span={12}>
                  <Field label="目标项目（来自项目映射）">
                    <Select value={form.repo||undefined} placeholder="选择项目…" style={{width:'100%'}} onChange={v=>setForm(f=>({...f,repo:v}))}>
                      {mappings.map(m=><Option key={m.id} value={m.name} disabled={!m.enabled}>{m.name}{m.enabled?'':'（停用）'}</Option>)}
                    </Select>
                  </Field>
                  <Field label="类型">
                    <Select value={form.kind} style={{width:'100%'}} onChange={v=>setForm(f=>({...f,kind:v}))}>
                      <Option value="task">任务 task</Option><Option value="feature">需求 feature</Option><Option value="bug">缺陷 bug</Option>
                    </Select>
                  </Field>
                  <Field label="模型（本任务执行所用，默认跟随全局）">
                    <Select value={form.model} style={{width:'100%'}} onChange={v=>setForm(f=>({...f,model:v}))}>{modelOptions(true)}</Select>
                  </Field>
                </Col>
                <Col span={12}>
                  <Field label="标题">
                    <TextArea rows={2} value={form.title} placeholder="例如：调整 ai_task 调度台，新增顶部 Tab" onChange={e=>setForm(f=>({...f,title:e.target.value}))} />
                  </Field>
                  <Field label="需求 / Bug 描述">
                    <TextArea rows={4} value={form.body} placeholder="写清要改什么、验收标准、注意事项…" onChange={e=>setForm(f=>({...f,body:e.target.value}))} />
                  </Field>
                </Col>
              </Row>
              <Text type="secondary">没有项目？到「项目映射」页添加 ai_task 等本地文件夹。</Text>
            </div>
          )},
          {key:'email',label:'邮件导入',children:(
            <div>
              <Text type="secondary">粘贴邮件主题/正文，自动识别 bug/需求并提取 git 地址；IMAP 凭证在「系统设置」中维护。</Text>
              <div style={{marginTop:12}}>
                <Field label="标题 / 邮件主题">
                  <TextArea rows={2} value={emailForm.title} placeholder="【BUG】登录 500 - cheerly-plan/CheerlyAgent" onChange={e=>setEmailForm(f=>({...f,title:e.target.value}))} />
                </Field>
                <Field label="描述 / 邮件正文">
                  <TextArea rows={4} value={emailForm.body} placeholder="问题描述、复现步骤、git 地址…" onChange={e=>setEmailForm(f=>({...f,body:e.target.value}))} />
                </Field>
                <Field label="执行模式">
                  <Select value={emailForm.mode} style={{width:'100%'}} onChange={v=>setEmailForm(f=>({...f,mode:v}))}>
                    <Option value="dry-run">dry-run（只生成命令，不改动）</Option>
                    <Option value="apply">apply（真实执行，需审批）</Option>
                  </Select>
                </Field>
              </div>
            </div>
          )},
          {key:'tapd',label:'TAPD（预留）',disabled:true,children:<div />},
        ]} />
      </Modal>

      {/* 选择文件夹弹窗 */}
      <Modal title="选择文件夹" visible={fsOpen} width={560} destroyOnClose
        onCancel={()=>setFsOpen(false)}
        footer={[
          <Button key="up" disabled={fs.at_root} onClick={()=>browseTo(fs.parent)}>↑ 上一级</Button>,
          <Button key="home" onClick={()=>browseTo('')}>主目录</Button>,
          <Button key="pick" type="primary" onClick={pickCurrent}>选择当前文件夹</Button>,
        ]}>
        <Text type="secondary">逐级点选进入子文件夹，点「选择当前文件夹」确定当前路径。</Text>
        <div style={{margin:'8px 0'}}><Text code>{fs.current||'…'}</Text></div>
        <Spin spinning={fsLoading}>
          <div style={{border:'1px solid #E4E3DE',borderRadius:8,maxHeight:320,overflow:'auto'}}>
            {fs.dirs.length ? fs.dirs.map(d=>(
              <div key={d.path} className="dir-row" onClick={()=>browseTo(d.path)}>
                <span style={{color:'#0F6E56'}}>{d.is_git?'●':'○'}</span>
                <span style={{flex:1,wordBreak:'break-all'}}>{d.name}</span>
                {d.is_git&&<Tag color="green">git</Tag>}
              </div>
            )) : <Empty image={Empty.PRESENTED_IMAGE_SIMPLE} description="此文件夹下没有子文件夹" />}
          </div>
        </Spin>
      </Modal>

      {/* 扫描结果弹窗 */}
      <Modal title={'扫描结果 · '+scanRoot} visible={scanOpen} width={560} destroyOnClose
        onCancel={()=>setScanOpen(false)}
        footer={[
          <Button key="all" onClick={toggleAllScan}>全选 / 全不选</Button>,
          <Button key="add" type="primary" onClick={addScanned}>加入映射</Button>,
        ]}>
        <Text type="secondary">{scanLoading?'扫描中…':(scanItems.length?('发现 '+scanItems.length+' 个文件夹（git 仓库排在前面），勾选后批量加入映射。'):'未发现候选文件夹')}</Text>
        <Spin spinning={scanLoading}>
          <div style={{marginTop:10,border:'1px solid #E4E3DE',borderRadius:8,maxHeight:380,overflow:'auto',padding:8}}>
            {scanItems.map((c,i)=>(
              <div key={c.path} style={{padding:'6px 4px',borderBottom:'1px solid #E4E3DE'}}>
                <Checkbox checked={c.checked} onChange={e=>setScanItems(prev=>prev.map((x,j)=>j===i?{...x,checked:e.target.checked}:x))}>
                  <div>
                    <Text strong>{c.candidate_name||c.name}</Text> {c.is_git&&<Tag color="green">git</Tag>}
                    <div><Text code type="secondary" style={{fontSize:11,wordBreak:'break-all'}}>{c.path}</Text></div>
                    {c.origin&&<div style={{color:'#0F6E56',fontSize:11}}>{c.origin}</div>}
                  </div>
                </Checkbox>
              </div>
            ))}
          </div>
        </Spin>
      </Modal>

      {/* 新增 / 编辑项目映射弹窗 */}
      <Modal title={editingMapId?'编辑项目映射':'新增项目映射'} visible={mapOpen} width={520} destroyOnClose
        onCancel={()=>setMapOpen(false)}
        footer={[
          <Button key="cancel" onClick={()=>setMapOpen(false)}>取消</Button>,
          <Button key="save" type="primary" onClick={saveMapFromModal}>保存</Button>,
        ]}>
        <Field label="项目名"><Input value={mapForm.name} placeholder="如 CheerlyAIChat" onChange={e=>setMapForm(f=>({...f,name:e.target.value}))} /></Field>
        <Field label="别名（逗号分隔）"><Input value={mapForm.aliases} placeholder="ai_chat, AI聊天" onChange={e=>setMapForm(f=>({...f,aliases:e.target.value}))} /></Field>
        <Field label="本地路径">
          <div style={{display:'flex',gap:6}}>
            <Input value={mapForm.path} placeholder="本地文件夹绝对路径" onChange={e=>setMapForm(f=>({...f,path:e.target.value}))} />
            <Button onClick={()=>openPicker(path=>setMapForm(f=>({...f,path})))}>选择</Button>
          </div>
        </Field>
        <Field label="仓库信息 / 备注"><Input value={mapForm.note} placeholder="git origin 地址或说明（可选）" onChange={e=>setMapForm(f=>({...f,note:e.target.value}))} /></Field>
      </Modal>

      {/* 报告弹窗 */}
      <Modal title={report.title} visible={reportOpen} width={760}
        onCancel={()=>setReportOpen(false)}
        footer={[
          ...(report.url?[<Button key="download" href={report.url} download={report.download}>下载 .md</Button>]:[]),
          <Button key="done" type="primary" onClick={()=>setReportOpen(false)}>关闭</Button>,
        ]}>
        <div className="report-body" dangerouslySetInnerHTML={{__html:report.html}} />
      </Modal>

      {/* 确认弹窗 */}
      <Modal title="请确认" visible={confirm.open} width={440} closable={false} maskClosable={false}
        onCancel={()=>closeConfirm(false)}
        footer={[
          <Button key="cancel" onClick={()=>closeConfirm(false)}>取消</Button>,
          <Button key="ok" type="primary" danger onClick={()=>closeConfirm(true)}>确认执行</Button>,
        ]}>
        <div style={{fontSize:13,lineHeight:1.7}}>{confirm.message}</div>
      </Modal>
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
